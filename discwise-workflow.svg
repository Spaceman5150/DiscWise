<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">DiscWise workflow</title>
<desc id="d">Latest Downloads folder; Verify FLAC integrity, codec and spectrum; Clean tags and folder names; Find, embed, or replace cover art; Automatically creates best-fit packing list groups; Automatically assemble each disc from the packing list; Grouped files move to Waiting to Burn folder; Burn physical copies of FLAC files (burning is the only step the system cannot monitor); Verify disc matches the packing list; DiscWise automatically marks the disc Burned and Verified in the checklist; Optional: files move to Need to Be Converted folder; MP3 copies made, FLACs deleted if you choose.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Ubuntu,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;text-anchor:middle}
.box{fill:#7639f0}
.lbl{fill:#fff}
.burn{fill:#f1e8ff;stroke:#7639f0;stroke-width:3;stroke-dasharray:8 5}
.burnlbl{fill:#4115be;font-size:18px}
.arrow{stroke:#8a8a8a;stroke-width:3;fill:none}
.burnsub{fill:#4115be;font-size:14px;font-weight:600}
.note{fill:#000;font-size:18px;font-weight:700}
.notebg{fill:#fff;stroke:#7639f0;stroke-width:2}
@media (prefers-color-scheme:dark){
.burn{fill:#241c3d;stroke:#bf8bfb} .burnlbl{fill:#bf8bfb} .burnsub{fill:#bf8bfb} .arrow{stroke:#aaa}
}
</style>
<defs><marker id="h" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8a8a8a"/></marker></defs>
<rect class="box" x="12" y="30" width="160" height="90" rx="14"/>
<text class="lbl" x="92.0" y="70.0">Latest Downloads</text>
<text class="lbl" x="92.0" y="90.0">folder</text>
<line class="arrow" x1="176" y1="75.0" x2="196" y2="75.0" marker-end="url(#h)"/>
<rect class="box" x="200" y="30" width="160" height="90" rx="14"/>
<text class="lbl" x="280.0" y="60.0">Verify FLAC</text>
<text class="lbl" x="280.0" y="80.0">integrity, codec</text>
<text class="lbl" x="280.0" y="100.0">and spectrum</text>
<line class="arrow" x1="364" y1="75.0" x2="384" y2="75.0" marker-end="url(#h)"/>
<rect class="box" x="388" y="30" width="160" height="90" rx="14"/>
<text class="lbl" x="468.0" y="70.0">Clean tags and</text>
<text class="lbl" x="468.0" y="90.0">folder names</text>
<line class="arrow" x1="552" y1="75.0" x2="572" y2="75.0" marker-end="url(#h)"/>
<rect class="box" x="576" y="30" width="160" height="90" rx="14"/>
<text class="lbl" x="656.0" y="60.0">Find, embed, or</text>
<text class="lbl" x="656.0" y="80.0">replace</text>
<text class="lbl" x="656.0" y="100.0">cover art</text>
<line class="arrow" x1="740" y1="75.0" x2="760" y2="75.0" marker-end="url(#h)"/>
<rect class="box" x="764" y="30" width="160" height="90" rx="14"/>
<text class="lbl" x="844.0" y="50">Automatically</text><text class="lbl" x="844.0" y="70">creates best-fit</text><text class="lbl" x="844.0" y="90">packing list</text><text class="lbl" x="844.0" y="110">groups</text>

<line class="arrow" x1="928" y1="75.0" x2="948" y2="75.0" marker-end="url(#h)"/>
<rect class="box" x="952" y="30" width="160" height="90" rx="14"/>
<text class="lbl" x="1032.0" y="50">Automatically</text><text class="lbl" x="1032.0" y="70">assemble each</text><text class="lbl" x="1032.0" y="90">disc from the</text><text class="lbl" x="1032.0" y="110">packing list</text>


<rect class="box" x="12" y="210" width="160" height="90" rx="14"/>
<text class="lbl" x="92.0" y="240">Grouped files</text><text class="lbl" x="92.0" y="260">move to Waiting</text><text class="lbl" x="92.0" y="280">to Burn folder</text>


<line class="arrow" x1="176" y1="255.0" x2="196" y2="255.0" marker-end="url(#h)"/>
<rect class="burn" x="200" y="210" width="160" height="90" rx="14"/>
<text class="burnlbl" x="280.0" y="238">Burn</text><text class="burnsub" x="280.0" y="260">physical copies</text><text class="burnsub" x="280.0" y="278">of FLAC files</text>
<line class="arrow" x1="364" y1="255.0" x2="384" y2="255.0" marker-end="url(#h)"/>
<rect class="box" x="388" y="210" width="160" height="90" rx="14"/>
<text class="lbl" x="468.0" y="240.0">Verify disc</text>
<text class="lbl" x="468.0" y="260.0">matches the</text>
<text class="lbl" x="468.0" y="280.0">packing list</text>
<line class="arrow" x1="552" y1="255.0" x2="572" y2="255.0" marker-end="url(#h)"/>
<rect class="box" x="576" y="210" width="160" height="90" rx="14"/>
<text class="lbl" x="656.0" y="230">Automatically</text><text class="lbl" x="656.0" y="250">marks it Burned</text><text class="lbl" x="656.0" y="270">and Verified in</text><text class="lbl" x="656.0" y="290">the checklist</text>
<line class="arrow" x1="740" y1="255.0" x2="760" y2="255.0" marker-end="url(#h)"/>
<rect class="box" x="764" y="210" width="160" height="90" rx="14"/>
<text class="lbl" x="844.0" y="230">Optional: move</text><text class="lbl" x="844.0" y="250">files to Need to</text><text class="lbl" x="844.0" y="270">Be Converted</text><text class="lbl" x="844.0" y="290">folder</text>
<line class="arrow" x1="928" y1="255.0" x2="948" y2="255.0" marker-end="url(#h)"/>
<rect class="box" x="952" y="210" width="160" height="90" rx="14"/>
<text class="lbl" x="1032.0" y="240.0">MP3 copies made;</text>
<text class="lbl" x="1032.0" y="260.0">FLACs deleted</text>
<text class="lbl" x="1032.0" y="280.0">if you choose</text>
<path class="arrow" d="M1032.0,124 V167 H92.0 V206" marker-end="url(#h)"/>
<rect class="notebg" x="180" y="304" width="200" height="84" rx="10"/>
<text class="note" x="280" y="330">Burning is</text>
<text class="note" x="280" y="352">the only step this</text>
<text class="note" x="280" y="374">system can’t monitor</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>